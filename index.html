<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE SILENT COMPANION — A Record of Domestic Stillness</title>

<!-- 字体系统：衬线标题（Playfair / Cormorant）+ 极细无衬线（Inter 300）+ 中文衬线（Noto Serif SC 300）+ 打字机（Special Elite）+ 手写（Caveat） -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@100;300;400&family=Noto+Serif+SC:wght@300;400&family=Playfair+Display:wght@400;500;600&family=Special+Elite&display=swap" rel="stylesheet">

<!-- Leaf 引擎底层：StPageFlip 2.0.7 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/css/page-flip.browser.css">
<style>
/* ============================================================
   KINFOLK DESIGN SYSTEM
   ============================================================ */
:root{
  --paper:#F7F5F0;
  --paper-deep:#ECE8E1;
  --paper-card:#FAF8F2;
  --ink:#2A2826;
  --ink-soft:rgba(42,40,38,.72);
  --ink-faint:rgba(42,40,38,.35);
  --line:rgba(42,40,38,.12);
  --line-strong:rgba(42,40,38,.24);
  --serif:'Cormorant Garamond',serif;
  --display:'Playfair Display',serif;
  --sans:'Inter',sans-serif;
  --cn:'Noto Serif SC',serif;
  --type:'Special Elite',monospace;
  --hand:'Caveat',cursive;
  --desk:#E7E3DB;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--desk);
  color:var(--ink);
  font-family:var(--sans);
  font-weight:300;
  overflow:hidden;
}
/* 全局细微胶片颗粒 */
.grain{
  position:fixed;inset:-60%;z-index:60;pointer-events:none;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
}
.app{height:100%;display:flex;flex-direction:column;}
.app-bar{
  position:relative;z-index:70;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 34px;border-bottom:1px solid var(--line);
  background:rgba(231,227,219,.88);backdrop-filter:blur(6px);
}
.issue-mark{
  font-family:var(--sans);font-weight:300;font-size:10px;
  letter-spacing:.34em;color:var(--ink-soft);text-transform:uppercase;
}
.app-title{font-family:var(--display);font-weight:400;font-size:15px;letter-spacing:.22em;color:var(--ink);}
.book-nav{display:flex;align-items:center;gap:18px;}
.nav-btn{
  appearance:none;background:transparent;border:1px solid var(--line);
  color:var(--ink-soft);font-family:var(--sans);font-weight:300;
  font-size:10px;letter-spacing:.28em;text-transform:uppercase;
  padding:8px 18px;cursor:pointer;transition:color .3s,border-color .3s,background .3s;
}
.nav-btn:hover{border-color:var(--line-strong);color:var(--ink);background:rgba(255,255,255,.5);}
.spread-index{
  font-family:var(--type);font-size:11px;letter-spacing:.24em;color:var(--ink-soft);
  min-width:44px;text-align:center;
}
/* 舞台与书 */
.stage{
  position:relative;flex:1;display:flex;align-items:center;justify-content:center;
  padding:30px 40px;overflow:hidden;
}
.stage::before{
  content:'';position:absolute;left:50%;bottom:-18%;transform:translateX(-50%);
  width:82%;height:34%;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(42,40,38,.16),transparent 70%);
  filter:blur(40px);pointer-events:none;
}
.book-holder{position:relative;flex:none;}
#book{position:absolute;top:0;left:0;transform-origin:top left;}
/* StPageFlip 内部元素覆写：哑光纸、去高光 */
.stf__parent{background:transparent !important;}
.stf__item{border-radius:0 !important;}
.stf__shadow{opacity:.35;}

/* ============================================================
   页面基座
   ============================================================ */
.page{
  position:relative;width:480px;height:640px;
  background:var(--paper);color:var(--ink);overflow:hidden;
  font-family:var(--sans);font-weight:300;
}
/* 哑光纸质感：极弱光泽 + 内阴影（pageGloss / enableLighting 对应） */
.page::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
  opacity:calc(var(--page-gloss,12) / 100);
  background:
    linear-gradient(115deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 30%,rgba(42,40,38,.05) 66%,rgba(255,255,255,.14) 100%);
  box-shadow:inset 0 0 60px rgba(42,40,38,.05);
}
.page-content{
  position:relative;z-index:6;height:100%;
  padding:52px 56px;display:flex;flex-direction:column;
}
.kicker{
  font-family:var(--sans);font-weight:300;font-size:9px;
  letter-spacing:.34em;text-transform:uppercase;color:var(--ink-faint);
}
.rule{height:1px;background:var(--line);margin:14px 0 22px;}
.pgno{
  position:absolute;bottom:22px;right:34px;z-index:7;
  font-family:var(--type);font-size:10px;letter-spacing:.2em;color:var(--ink-faint);
}
.pgno::before{content:'— ';}
/* 页面内图片通用 */
.pg-img{
  position:relative;overflow:hidden;background:var(--paper-deep);
  border:1px solid var(--line);
}
.pg-img img{width:100%;height:100%;object-fit:cover;display:block;}
.pg-img .grain-layer{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23g)' opacity='0.62'/></svg>");
}

/* ============================================================
   封面 Cover
   ============================================================ */
.cover .page-content{justify-content:space-between;}
.cover-head{display:flex;flex-direction:column;gap:20px;}
.cover-rule{height:1px;background:var(--line);}
.cover-title{
  font-family:var(--display);font-weight:500;font-size:56px;line-height:1.04;
  letter-spacing:.04em;
}
.cover-title .thin{font-weight:400;font-style:italic;color:var(--ink-soft);}
.cover-sub{
  font-family:var(--serif);font-style:italic;font-weight:300;font-size:19px;
  color:var(--ink-soft);
}
.cover-figure{position:relative;flex:none;width:78%;aspect-ratio:3/3.6;align-self:flex-start;}
.cover-figure .pg-img{width:100%;height:100%;filter:contrast(.94) saturate(.85);}
.cover-foot{
  display:flex;justify-content:space-between;align-items:flex-end;
  font-family:var(--sans);font-weight:300;font-size:8.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink-faint);
}

/* ============================================================
   序言页 Essay（首字下沉）
   ============================================================ */
.essay{flex:1;display:flex;flex-direction:column;justify-content:flex-end;}
.essay h2{
  font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.25;
  margin-bottom:26px;
}
.essay h2 em{font-style:italic;font-weight:300;color:var(--ink-soft);}
.essay .body{
  font-family:var(--serif);font-weight:400;font-size:16.5px;line-height:1.75;
  color:var(--ink-soft);
}
.essay .body::first-letter{
  font-family:var(--display);font-weight:500;font-size:64px;line-height:.78;
  float:left;padding:10px 14px 0 0;color:var(--ink);
}
.essay .sig{
  margin-top:34px;border-top:1px solid var(--line);padding-top:16px;
  font-family:var(--type);font-size:10px;letter-spacing:.18em;color:var(--ink-faint);
}

/* ============================================================
   卡槽页 Card Pocket（凹陷式纸槽 + 抽出卡片）
   ============================================================ */
.pocket-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;}
.paper-pocket{
  position:relative;width:300px;height:410px;
  background:#F0EDE6;
  box-shadow:inset 0 2px 4px rgba(42,40,38,.08), inset 0 1px 2px rgba(42,40,38,.12);
  border-top:1px solid rgba(42,40,38,.06);
  border-radius:2px;
  overflow:hidden;
}
.paper-pocket .slot-mark{
  position:absolute;top:14px;left:0;right:0;text-align:center;
  font-family:var(--sans);font-weight:300;font-size:8px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--ink-faint);
}
.collect-card{
  position:absolute;top:0;left:0;width:100%;height:454px;
  display:block;appearance:none;background:transparent;border:none;cursor:pointer;
  padding:0;text-align:left;font-family:inherit;color:inherit;
  transform:translateY(20px);
  transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s cubic-bezier(.16,1,.3,1);
  box-shadow:0 4px 12px rgba(42,40,38,.06);
  will-change:transform;
}
.paper-pocket:hover .collect-card{
  transform:translateY(-24px) rotate(-0.5deg);
  box-shadow:0 12px 28px rgba(42,40,38,.12);
}
.polaroid{
  width:100%;height:100%;
  background:var(--paper-card);
  border:1px solid rgba(42,40,38,.1);
  padding:14px 14px 18px;display:flex;flex-direction:column;
}
.polaroid .pg-img{flex:1;width:100%;}
.polaroid .cap{
  padding-top:12px;text-align:center;
  font-family:var(--type);font-size:10.5px;letter-spacing:.14em;color:var(--ink-soft);
}
.pocket-note{
  font-family:var(--sans);font-weight:300;font-size:9px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-faint);text-align:center;
}

/* ============================================================
   视觉页 Visual Field
   ============================================================ */
.visual-body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:34px;}
.visual-body .pg-img{width:100%;aspect-ratio:4/4.9;}
.visual-cap{
  font-family:var(--serif);font-style:italic;font-weight:300;font-size:15px;
  color:var(--ink-soft);text-align:center;letter-spacing:.02em;
}

/* ============================================================
   收集矩阵页 Collection Matrix（3 联卡位）
   ============================================================ */
.matrix{flex:1;display:flex;flex-direction:column;justify-content:flex-start;gap:18px;}
.slot-row{display:flex;justify-content:space-between;align-items:flex-start;flex:none;}
.slot{
  position:relative;width:196px;height:252px;flex:none;
  background:#F0EDE6;
  box-shadow:inset 0 2px 4px rgba(42,40,38,.08), inset 0 1px 2px rgba(42,40,38,.12);
  border-top:1px solid rgba(42,40,38,.06);border-radius:2px;overflow:hidden;
}
.slot .collect-card{height:278px;transform:translateY(16px);transition:transform .4s cubic-bezier(.16,1,.3,1),box-shadow .4s cubic-bezier(.16,1,.3,1);}
.slot:hover .collect-card{transform:translateY(-14px) rotate(-.4deg);box-shadow:0 12px 28px rgba(42,40,38,.12);}
.slot .polaroid{padding:10px 10px 13px;}
.slot .polaroid .cap{font-size:9px;letter-spacing:.1em;}
.slot-offset-1{margin-top:22px;}
.slot-offset-2{margin-top:-6px;}
/* 锁卡：极细浅灰双线框 + 压印文字 */
.locked-slot{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  border:1px dashed rgba(42,40,38,.26);outline:1px solid rgba(42,40,38,.1);outline-offset:-7px;
  background:transparent;box-shadow:none;cursor:pointer;appearance:none;
  font-family:inherit;color:inherit;width:100%;height:100%;
}
.locked-slot .lock-glyph{width:30px;height:30px;border:1px solid var(--ink-faint);border-radius:50%;position:relative;}
.locked-slot .lock-glyph::after{content:'';position:absolute;inset:9px;border:1px solid var(--ink-faint);border-radius:50%;}
.locked-slot .lock-txt{
  font-family:var(--type);font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--ink-faint);
  text-shadow:0 1px 0 rgba(255,255,255,.55);
}
/* 抖动：点击未解锁卡槽的温和反馈 */
.shake{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{
  0%,100%{transform:translateX(0);}
  15%{transform:translateX(-4px);}
  35%{transform:translateX(4px);}
  55%{transform:translateX(-3px);}
  75%{transform:translateX(3px);}
}
/* 解锁蜡封压印（Deboss/Stamp，一次性） */
.stamp-ring{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;opacity:0;
}
.stamp-ring::before{
  content:'';width:120px;height:120px;border-radius:50%;
  border:1px solid rgba(42,40,38,.5);
  background:radial-gradient(circle,rgba(42,40,38,0) 58%,rgba(42,40,38,.22) 72%,rgba(42,40,38,0) 100%);
  box-shadow:inset 0 0 18px rgba(42,40,38,.3);
}
.stamping .stamp-ring{animation:stampIn 1.1s cubic-bezier(.16,1,.3,1) forwards;}
@keyframes stampIn{
  0%{transform:scale(1.6);opacity:0;}
  40%{transform:scale(.94);opacity:1;}
  60%{transform:scale(1);opacity:1;}
  100%{transform:scale(1);opacity:0;}
}
.card-reveal{animation:cardReveal 1.2s ease forwards;}
@keyframes cardReveal{0%{opacity:0;filter:sepia(1) contrast(1.1);}60%{opacity:1;}100%{filter:none;}}
.matrix-foot{
  font-family:var(--sans);font-weight:300;font-size:8.5px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--ink-faint);text-align:center;
}

/* ============================================================
   博物观察页 Anatomy（博物馆展签）
   ============================================================ */
.tax-row{display:flex;justify-content:space-between;align-items:baseline;}
.tax-row .lbl{font-family:var(--sans);font-weight:300;font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-faint);}
.tax-row .val{font-family:var(--serif);font-style:italic;font-weight:400;font-size:16px;color:var(--ink-soft);}
.plate{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;margin-top:8px;}
.figure-group{display:flex;align-items:center;gap:20px;}
.figure-group svg{flex:none;}
.fig-label{flex:1;}
.fig-label .no{font-family:var(--type);font-size:10px;letter-spacing:.18em;color:var(--ink-faint);}
.fig-label .nm{font-family:var(--sans);font-weight:300;font-size:9px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-soft);margin-top:4px;}
.fig-label .ds{font-family:var(--serif);font-style:italic;font-weight:300;font-size:13px;color:var(--ink-faint);margin-top:4px;}
.plate-foot{
  font-family:var(--type);font-size:9.5px;letter-spacing:.2em;color:var(--ink-faint);
  border-top:1px solid var(--line);padding-top:14px;
}

/* ============================================================
   物证卡页 Specimen（硫酸纸 + 和纸胶带）
   ============================================================ */
.specimen-wrap{flex:1;display:flex;align-items:center;justify-content:center;}
.specimen{
  position:relative;width:330px;height:440px;padding:26px 24px;
  background:linear-gradient(160deg,rgba(250,248,242,.72),rgba(236,232,225,.55));
  backdrop-filter:blur(2px);
  border:1px solid rgba(42,40,38,.14);
  box-shadow:0 14px 34px rgba(42,40,38,.1);
}
.specimen .tape{
  position:absolute;top:-14px;left:16px;width:64px;height:26px;
  background:rgba(236,232,225,.55);transform:rotate(-28deg);
  border:1px solid rgba(42,40,38,.08);
  box-shadow:0 1px 2px rgba(42,40,38,.06);
}
.specimen .spec-no{
  font-family:var(--type);font-size:10px;letter-spacing:.2em;color:var(--ink-soft);
  border-bottom:1px solid rgba(42,40,38,.1);padding-bottom:10px;
}
.specimen .pg-img{width:100%;aspect-ratio:1/1.1;margin-top:16px;filter:saturate(.8) contrast(.95);}
.specimen .pg-img::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(120deg,rgba(255,255,255,.25),transparent 40%,rgba(42,40,38,.06));
  mix-blend-mode:multiply;pointer-events:none;
}
.specimen .spec-txt{
  margin-top:18px;font-family:var(--serif);font-style:italic;font-weight:300;font-size:14px;line-height:1.6;color:var(--ink-soft);
}
.specimen .spec-micro{
  position:absolute;bottom:18px;left:24px;right:24px;text-align:center;
  font-family:var(--sans);font-weight:300;font-size:7.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-faint);
}

/* ============================================================
   封底 Back Cover
   ============================================================ */
.back .page-content{align-items:center;justify-content:center;text-align:center;}
.back-grid{display:flex;flex-direction:column;align-items:center;gap:26px;}
.back-grid .barcode{width:150px;}
.back-grid .publish{
  font-family:var(--sans);font-weight:300;font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:var(--ink-soft);
}
.back-paw{width:46px;height:46px;opacity:.5;}
.back-paw circle,.back-paw ellipse{fill:none;stroke:var(--ink-soft);stroke-width:1;}

/* ============================================================
   弹层 Lightbox（高清无裁切 + 卡背手写笔记）
   ============================================================ */
.lightbox{
  position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
  background:rgba(42,40,38,.42);backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .35s ease;
}
.lightbox.on{opacity:1;pointer-events:auto;}
.lb-card{
  width:min(560px,88vw);max-height:86vh;overflow:auto;
  background:var(--paper-card);border:1px solid var(--line-strong);
  box-shadow:0 34px 80px rgba(42,40,38,.35);
  animation:lbIn .45s cubic-bezier(.16,1,.3,1);
}
@keyframes lbIn{from{transform:translateY(16px) scale(.98);opacity:0;}to{transform:none;opacity:1;}}
.lb-head{
  position:relative;background:var(--paper-deep);
  min-height:300px;display:flex;align-items:center;justify-content:center;
  border-bottom:1px solid var(--line);padding:26px;
}
.lb-head img{max-width:100%;max-height:300px;object-fit:contain;filter:contrast(.96) saturate(.86);}
.lb-body{padding:30px 34px 26px;}
.lb-no{font-family:var(--type);font-size:10px;letter-spacing:.24em;color:var(--ink-faint);}
.lb-title{font-family:var(--display);font-weight:500;font-size:26px;margin:10px 0 6px;}
.lb-meta{font-family:var(--sans);font-weight:300;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);}
.lb-note{
  margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;gap:14px;align-items:flex-start;
}
.lb-note .tag{
  flex:none;font-family:var(--sans);font-weight:300;font-size:8px;letter-spacing:.28em;
  text-transform:uppercase;color:var(--ink-faint);padding-top:6px;
}
.lb-note .hand{
  font-family:var(--hand);font-size:21px;line-height:1.35;color:var(--ink-soft);transform:rotate(-1.2deg);
}
.lb-close{
  position:absolute;top:0;right:0;
  appearance:none;background:transparent;border:none;cursor:pointer;
  padding:16px 20px;font-family:var(--sans);font-weight:300;font-size:11px;
  letter-spacing:.24em;color:var(--ink-soft);transition:color .3s;
}
.lb-close:hover{color:var(--ink);}

/* ============================================================
   Toast
   ============================================================ */
.toast{
  position:fixed;bottom:34px;left:50%;transform:translateX(-50%) translateY(20px);
  z-index:110;background:var(--paper-card);border:1px solid var(--line-strong);
  padding:11px 26px;opacity:0;pointer-events:none;transition:all .45s cubic-bezier(.16,1,.3,1);
  font-family:var(--sans);font-weight:300;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);
  box-shadow:0 12px 30px rgba(42,40,38,.14);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

/* ============================================================
   TCG 开包舞台（精简版：点击撕包 → 3D 翻卡 → 归档入册）
   ============================================================ */
.pack-stage{
  position:fixed;inset:0;z-index:90;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(247,245,240,.97);backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .4s ease;
  padding:34px 20px;
}
.pack-stage.on{opacity:1;pointer-events:auto;}
.pack-close{
  position:absolute;top:16px;right:20px;z-index:5;
  appearance:none;background:transparent;border:1px solid var(--line);
  color:var(--ink-soft);font-family:var(--sans);font-weight:300;font-size:9px;
  letter-spacing:.26em;text-transform:uppercase;padding:7px 14px;cursor:pointer;
}
.pack-close:hover{color:var(--ink);border-color:var(--line-strong);}
.pack-zone{
  position:relative;display:flex;align-items:center;justify-content:center;
  min-height:340px;max-width:100%;margin:0 14px;
}
/* —— 3D 铝箔卡包：透视 + 侧厚 + 流动高光 —— */

   ============================================================ */
class LeafFlip {
  constructor(container, config) {
    const format = config.pageFormat || 'portrait-3-4';
    const sizes = { 'portrait-3-4': [480, 640] };
    const [w, h] = sizes[format] || sizes['portrait-3-4'];

    this.config = config;
    this.flip = new St.PageFlip(container, {
      width: w,
      height: h,
      size: 'fixed',
      flippingTime: 1150,
      maxShadowOpacity: Math.min(Math.max((config.shadowDepth || 35) / 100, 0), 1),
      drawShadow: !!config.enableLighting,
      showCover: true,
      usePortrait: false,
      autoSize: false,
      clickEventForward: true,
      disableFlipByClick: true,
      useMouseEvents: true,
      mobileScrollSupport: true,
      swipeDistance: 40,
      startPage: 0,
    });
    // 光照配置 → CSS 变量（哑光光泽层 / 阴影柔化）
    container.style.setProperty('--page-gloss', (config.pageGloss ?? 12));
    container.style.setProperty('--page-blur', (config.shadowBlur ?? 70) + 'px');
  }
  loadFromHtml(nodes) { this.flip.loadFromHTML(nodes); }
  on(ev, cb) { this.flip.on(ev, cb); }
  flipNext() { this.flip.flipNext('bottom'); }
  flipPrev() { this.flip.flipPrev('bottom'); }
  getCurrentPageIndex() { return this.flip.getCurrentPageIndex(); }
}

/* ============================================================
   WebAudio —— heavy-card 厚磅纸翻页阻尼音效
   ============================================================ */
let audioCtx = null;
const ctx = () => { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; };
function playHeavyCard() {
  try {
    const ac = ctx(), t = ac.currentTime;
    if (ac.state === 'suspended') ac.resume();
    /* 低频纸板闷响 */
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(118, t);
    osc.frequency.exponentialRampToValueAtTime(52, t + .13);
    const og = ac.createGain();
    og.gain.setValueAtTime(.0001, t);
    og.gain.exponentialRampToValueAtTime(.16, t + .02);
    og.gain.exponentialRampToValueAtTime(.0001, t + .3);
    osc.connect(og).connect(ac.destination);
    osc.start(t); osc.stop(t + .32);
    /* 纸页翻动沙沙声 */
    const dur = .42, buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass'; bp.Q.value = .7;
    bp.frequency.setValueAtTime(720, t);
    bp.frequency.exponentialRampToValueAtTime(280, t + dur);
    const ng = ac.createGain();
    ng.gain.setValueAtTime(.0001, t);
    ng.gain.exponentialRampToValueAtTime(.05, t + .03);
    ng.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(bp).connect(ng).connect(ac.destination);
    src.start(t); src.stop(t + dur);
    /* 落纸轻拍 */
    const o2 = ac.createOscillator();
    o2.type = 'triangle';
    o2.frequency.setValueAtTime(210, t + .18);
    o2.frequency.exponentialRampToValueAtTime(90, t + .3);
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(.0001, t + .18);
    g2.gain.exponentialRampToValueAtTime(.05, t + .21);
    g2.gain.exponentialRampToValueAtTime(.0001, t + .34);
    o2.connect(g2).connect(ac.destination);
    o2.start(t + .18); o2.stop(t + .36);
  } catch (e) { /* 无音频时静默 */ }
}
function playStamp() {
  try {
    const ac = ctx(), t = ac.currentTime;
    const osc = ac.createOscillator();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(140, t);
    osc.frequency.exponentialRampToValueAtTime(70, t + .1);
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.12, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + .18);
    osc.connect(g).connect(ac.destination);
    osc.start(t); osc.stop(t + .2);
  } catch (e) {}
}
document.addEventListener('pointerdown', () => { try { ctx(); } catch (e) {} }, { once: true });

/* ============================================================
   TCG 开包系统（精简版）：IDLE → 撕包 → 逐张翻卡 → 归档入册
   ============================================================ */
const packStage = document.getElementById('packStage');
const foilPack = document.getElementById('foilPack');
const foilPackWrap = document.getElementById('foilPackWrap');
const tearStrip = document.getElementById('tearStrip');
const pkDeck = document.getElementById('pkDeck');
const pkArea = document.getElementById('pkArea');
const pkArchive = document.getElementById('pkArchive');
const packCap = document.getElementById('packCap');
const COMMON_POOL = ['c4', 'c5'];
const RARE_ID = 'c3';

let packBusy = false;
let stackOpened = [];   /* 包内卡 id 顺序：普通 → 普通 → 稀有（末位） */
let deckOrder = [];     /* 卡叠队列：deckOrder[0] = 最上层，末尾 = 叠底（稀有初始保底） */
let allFlipped = false;
let dragging = null;
let flipCount = 0;

function playTear() {
  try {
    const ac = ctx(), t = ac.currentTime, dur = .26;
    const buf = ac.createBuffer(1, Math.floor(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const p = i / d.length;
      d[i] = (Math.random() * 2 - 1) * (1 - p) * (0.4 + 0.6 * (i % 7) / 7);
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1600;
    const g = ac.createGain();
    g.gain.setValueAtTime(.0001, t);
    g.gain.exponentialRampToValueAtTime(.08, t + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    src.connect(hp).connect(g).connect(ac.destination);
    src.start(t); src.stop(t + dur);
    const o = ac.createOscillator();
    o.type = 'square'; o.frequency.value = 3400;
    const og = ac.createGain();
    og.gain.setValueAtTime(.0001, t);
    og.gain.exponentialRampToValueAtTime(.02, t + .01);
    og.gain.exponentialRampToValueAtTime(.0001, t + .1);
    o.connect(og).connect(ac.destination);
    o.start(t); o.stop(t + .12);
  } catch (e) {}
}

function openPack() {
  if (packBusy) return;
  stackOpened = COMMON_POOL.slice().sort(() => Math.random() - .5).concat(RARE_ID);
  deckOrder = stackOpened.slice();
  allFlipped = false;
  flipCount = 0;
  foilPack.classList.remove('torn');
  foilPackWrap.classList.remove('gone');
  foilPackWrap.style.display = '';
  tearStrip.classList.remove('torn');
  pkDeck.classList.remove('show', 'done');
  pkArea.classList.remove('show', 'done');
  pkArchive.classList.remove('on');
  packCap.textContent = '一包三张 · 末尾藏有一张稀有卡';
  packStage.classList.add('on');
}

function tearHandler(e) {
  if (e && e.type === 'keydown' && e.key !== 'Enter' && e.key !== ' ') return;
  if (e && e.type === 'keydown') e.preventDefault();
  tear();
}

function tear() {
  if (packBusy) return;
  packBusy = true;
  playTear();
  tearStrip.classList.add('torn');
  foilPack.classList.add('torn');
  setTimeout(() => {
    foilPackWrap.classList.add('gone');
    buildDeck();
    pkArea.classList.add('show');
    packCap.textContent = '点击最上层卡牌翻面 · 或拖动放到叠底';
    setTimeout(() => { foilPackWrap.style.display = 'none'; }, 560);
    packBusy = false;
  }, 500);
}

function buildDeck() {
  pkDeck.innerHTML = '';
  deckOrder.forEach((id, i) => {
    pkDeck.appendChild(makeCardEl(id, i));
  });
  layoutDeck();
  pkDeck.classList.add('show');
}

function makeCardEl(id, idx) {
  const rare = id === RARE_ID;
  const card = byId(id);
  const el = document.createElement('div');
  el.className = 'pk-card' + (rare ? ' rare' : '');
  el.dataset.id = id;
  el.setAttribute('aria-label', 'card ' + (idx + 1));
  el.innerHTML =
    '<span class="pk-face pk-back"><span class="pk-back-mark"></span></span>' +
    '<span class="pk-face pk-front">' +
      (rare ? '<span class="pk-rare-chip">UR</span>' : '') +
      '<span class="pk-img"><img src="' + card.imageSrc + '" alt="' + card.title + '"></span>' +
      '<span class="pk-meta"><span class="pk-no">No. ' + card.indexNumber + '</span>' +
      '<span class="pk-name">' + card.cardTitle + ' — ' + card.cardSub + '</span></span>' +
    '</span>';
  return el;
}

function layoutDeck() {
  deckOrder.forEach((id, i) => {
    const el = pkDeck.querySelector('[data-id="' + id + '"]');
    if (!el) return;
    el.classList.remove('pos0', 'pos1', 'pos2', 'pos3');
    el.classList.add('pos' + Math.min(i, 3));
    el.style.zIndex = String(50 - i);
    el.dataset.pos = i;
  });
}

/* 点击翻面：最上层卡原地 3D 翻转 180°，翻完后仍在原位（正面朝上），
   之后用户可拖动它沉到叠底，让下一张浮现。 */
function flipCard(el, id) {
  if (el.classList.contains('held') || el.classList.contains('flipping')) return;
  if (el.dataset.pos !== '0') return;   /* 只能翻最上层 */
  if (el._flipped) return;
  el._flipped = true;
  flipCount++;
  playHeavyCard();
  if (id === RARE_ID) playStamp();
  el.classList.add('flipping');
  setTimeout(() => {
    el.classList.remove('flipping');
    el.style.setProperty('--rot', 'rotateY(180deg)');
  }, 520);
  if (flipCount >= stackOpened.length) {
    setTimeout(() => {
      allFlipped = true;
      pkDeck.querySelectorAll('.pk-card').forEach(c => c.classList.remove('pos0', 'pos1', 'pos2', 'pos3'));
      pkArea.classList.add('done');
      pkDeck.classList.add('done');
      pkArchive.classList.add('on');
      packCap.textContent = '全卡已揭晓 · 归档入册';
    }, 760);
  }
}

/* —— 拖动：把最上层卡沉到叠底，下一张浮起 —— */
function dragStart(el, x, y) {
  dragging = { el, sx: x, sy: y, cx: x, cy: y, moved: false };
  el.classList.add('held');
  el.style.setProperty('--dx', '0px');
  el.style.setProperty('--dy', '0px');
}
function dragMove(x, y) {
  if (!dragging) return;
  const dx = x - dragging.sx, dy = y - dragging.sy;
  if (!dragging.moved && Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
  dragging.moved = true;
  dragging.cx = x; dragging.cy = y;
  dragging.el.style.setProperty('--dx', dx + 'px');
  dragging.el.style.setProperty('--dy', dy + 'px');
}
function sinkToBottom(el) {
  const i = deckOrder.indexOf(el.dataset.id);
  if (i > -1) { deckOrder.splice(i, 1); deckOrder.push(el.dataset.id); }
  layoutDeck();
}
function dragEnd() {
  if (!dragging) return;
  const el = dragging.el, moved = dragging.moved;
  const dx = dragging.cx - dragging.sx;
  dragging = null;
  el.classList.remove('held');
  el.style.removeProperty('--dx');
  el.style.removeProperty('--dy');
  if (moved && Math.abs(dx) > 46) {
    /* 拖出 → 沉到叠底（保持当前正反面，--rot 已由 JS 控制） */
    sinkToBottom(el);
    return;
  }
  /* 未拖出 → 复位；若是最上层且未翻过，视为点击 → 翻面 */
  el.classList.add('pos0');
  if (!moved && el.dataset.pos === '0' && !el._flipped) {
    flipCard(el, el.dataset.id);
  }
}

/* 事件绑定：pointer（触屏/鼠标）+ mouse 兜底 + click 一键（兼容自动化/无拖拽场景） */
function onDeckDown(e) {
  if (allFlipped) return;
  const el = e.target.closest('.pk-card');
  if (!el || el.dataset.pos !== '0') return;
  if (el.classList.contains('held') || el.classList.contains('fly')) return;
  e.preventDefault();
  dragStart(el, e.clientX, e.clientY);
}
function onDeckMove(e) { if (dragging) dragMove(e.clientX, e.clientY); }
function onDeckUp() { if (dragging) dragEnd(); }
pkDeck.addEventListener('pointerdown', onDeckDown);
pkDeck.addEventListener('mousedown', onDeckDown);
document.addEventListener('pointermove', onDeckMove);
document.addEventListener('mousemove', onDeckMove);
document.addEventListener('pointerup', onDeckUp);
document.addEventListener('mouseup', onDeckUp);
document.addEventListener('pointercancel', onDeckUp);
pkDeck.addEventListener('click', e => {
  const el = e.target.closest('.pk-card');
  if (!el || el.dataset.pos !== '0') return;
  if (el._flipped || el.classList.contains('held') || el.classList.contains('flipping')) return;
  if (dragging && dragging.moved) return;
  flipCard(el, el.dataset.id);
});

function addExtraSlot(card) {
  const matrix = document.getElementById('matrixEl');
  let row = matrix.querySelector('.slot-row.extra');
  if (!row) {
    row = document.createElement('div');
    row.className = 'slot-row extra';
    matrix.appendChild(row);
    matrix.classList.add('compact');
  }
  if (row.querySelector('[data-card="' + card.id + '"]')) return;
  const slot = document.createElement('div');
  slot.className = 'slot';
  slot.innerHTML =
    '<button type="button" class="collect-card" data-card="' + card.id + '" aria-label="Open card No. ' + card.indexNumber + '">' +
      '<span class="polaroid">' + grainLayer() +
        '<span class="pg-img"><img src="' + card.imageSrc + '" alt="' + card.title + '" onerror="this.parentElement.classList.add(\'pg-img--flat\')"></span>' +
        '<span class="cap">No. ' + card.indexNumber + ' · ' + card.cardTitle + '</span>' +
      '</span>' +
    '</button>';
  row.appendChild(slot);
}

function archivePack() {
  if (packBusy) return;
  packBusy = true;
  pkArchive.classList.remove('on');
  let added = 0;
  stackOpened.forEach(id => {
    const card = byId(id);
    if (id === RARE_ID) { unlockCardC(); return; }
    if (card && !card.isCollected) { card.isCollected = true; added++; addExtraSlot(card); }
  });
  packCap.textContent = added ? '已放入收集册 · ' + added + ' 张新卡入册' : '已放入收集册（均为已有卡）';
  toast('已放入收集册 — ' + stackOpened.length + ' 张');
  setTimeout(() => {
    packStage.classList.remove('on');
    packBusy = false;
  }, 800);
}

document.getElementById('btnPack').addEventListener('click', openPack);
foilPack.addEventListener('click', tearHandler);
foilPack.addEventListener('keydown', tearHandler);
document.getElementById('packClose').addEventListener('click', () => {
  if (packBusy) return;
  packStage.classList.remove('on');
  pkDeck.classList.remove('show', 'done');
  pkArea.classList.remove('show', 'done');
  foilPack.classList.remove('torn');
  foilPackWrap.classList.remove('gone');
  foilPackWrap.style.display = '';
  tearStrip.classList.remove('torn');
  pkArchive.classList.remove('on');
});
pkArchive.addEventListener('click', archivePack);
</script>
</body>
